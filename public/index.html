<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quản lí kho Vitot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231d9e57'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>V</text></svg>">
</head>
<body>

<!-- Màn hình đăng nhập PIN -->
<div id="loginWrap">
  <div class="card login-card">
    <img class="logo-img" src="vitot-logo.png" alt="Logo Vitot" style="width:64px;height:64px;border-radius:20px;margin:0 auto 12px">
    <h1 style="margin:0;font-size:21px">Quản lí kho Vitot</h1>
    <div class="mut" style="margin-top:4px">Hệ thống nội bộ v34.261126</div>
    <p class="mut" id="loginHint" style="margin:16px 0 0">Nhập mã PIN 4 số để đăng nhập</p>
    <div class="pin-dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
    <div class="pinpad" id="pinPad"></div>
  </div>
</div>

<!-- Ứng dụng -->
<div id="app" class="hidden">
  <div id="scrim"></div>
  <aside id="sidebar">
    <div class="brand">
      <img class="logo-img" src="vitot-logo.png" alt="Logo Vitot">
      <div><h1>Quản lí kho Vitot</h1><div class="sub">Hệ thống nội bộ v34.261126</div></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div style="padding:2px 10px 8px">
        <div id="footName" style="font-weight:700"></div>
        <div id="footRole" class="mut"></div>
      </div>
      <button class="nav-item" id="logoutBtn">⎋ <span data-i18n="logout">Đăng xuất</span></button>
    </div>
  </aside>
  <main id="main">
    <div id="topbar">
      <button class="icon-btn" id="hamburger">☰</button>
      <h2 id="viewTitle"></h2>
      <span class="pill" id="invBadge"></span>
      <button class="btn" id="syncBtn" title="Đọc lại toàn bộ dữ liệu từ Google Sheet ngay">↻ Đồng bộ</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<!-- Modal thông báo -->
<div id="modalWrap">
  <div class="modal">
    <div class="modal-head"><span class="mh-dot"></span>VITOT FOOD • THÔNG BÁO</div>
    <div class="modal-body">
      <div class="modal-icon" id="modalIcon">!</div>
      <h3 id="modalTitle"></h3>
      <p id="modalMsg"></p>
      <button class="btn primary" id="modalOk">Đã hiểu</button>
    </div>
  </div>
</div>

<!-- Modal xác nhận 2 nút (Đồng ý / Huỷ) -->
<div id="confirmWrap">
  <div class="modal">
    <div class="modal-head"><span class="mh-dot"></span>VITOT FOOD • THÔNG BÁO</div>
    <div class="modal-body">
      <div class="modal-icon warn" id="confirmIcon">!</div>
      <h3 id="confirmTitle"></h3>
      <p id="confirmMsg"></p>
      <div style="display:flex;gap:8px;margin-top:20px">
        <button class="btn" id="confirmNo" style="flex:1">Huỷ</button>
        <button class="btn primary" id="confirmYes" style="flex:1">Đồng ý</button>
      </div>
    </div>
  </div>
</div>
<!-- Modal chi tiết phiếu gốc (v33) -->
<div id="slipWrap">
  <div class="modal wide">
    <div class="modal-head"><span class="mh-dot"></span><span id="slipTitle">Chi tiết phiếu</span><button class="slip-x" id="slipClose" title="Đóng">✕</button></div>
    <div class="slip-body" id="slipBody"></div>
  </div>
</div>
<div id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
